<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Orbit Lines</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; color: #eee; }
  canvas { display: block; cursor: crosshair; }
  #info { position: fixed; left: 20px; top: 20px; bottom: 64px; width: 320px; display: flex; flex-direction: column; font: 13px/1.45 Helvetica, Arial, sans-serif; pointer-events: none; }
  h1 { font: 400 13px Helvetica, Arial, sans-serif; margin: 0 0 14px; }
  #head { white-space: pre-wrap; margin-bottom: 14px; color: #888; }
  #list { overflow-y: auto; pointer-events: auto; border-top: 1px solid #eee; scrollbar-width: thin; }
  #list:empty { border: 0; }
  .row { display: flex; justify-content: space-between; gap: 12px; cursor: pointer; padding: 5px 4px; border-bottom: 1px solid #2a2a2a; }
  .row span:last-child { color: #777; white-space: nowrap; }
  .row:hover { background: #161616; }
  .row.sel { background: #c8ff00; color: #000; }
  #restart { position: fixed; left: 20px; bottom: 20px; font: 13px Helvetica, Arial, sans-serif; color: #eee; background: #000; border: 1px solid #eee; padding: 6px 14px; cursor: pointer; }
  #restart:hover { background: #c8ff00; color: #000; border-color: #c8ff00; }
  #info, #restart { opacity: 0; pointer-events: none !important; transition: opacity 1.2s; }
  body.started #info, body.started #restart { opacity: 1; }
  body.started #restart { pointer-events: auto !important; }
  body.started #list { pointer-events: auto; }
  .row.sel span:last-child { color: #333; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"><h1>Orbit Lines</h1><div id="head">loading…</div><div id="list"></div></div>
<button id="restart">Restart</button>
<script src="vendor/satellite.min.js"></script>
<script src="app.js"></script>
</body>
</html>
